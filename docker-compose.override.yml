services:
  zeiss-api:
    build:
      context: ./Zeiss.ProductManagement.Api
      dockerfile: Zeiss.ProductManagement.Api/Dockerfile
      target: build
    command: dotnet watch run --urls http://0.0.0.0:8080
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
    volumes:
      - ./Zeiss.ProductManagement.Api:/src
    healthcheck:
      disable: true

  zeiss-frontend:
    build:
      context: ./zeiss-product-management-front
      dockerfile: Dockerfile.dev
    command: npm run start:docker
    volumes:
      - ./zeiss-product-management-front:/app
      - /app/node_modules
    ports: !override
      - "127.0.0.1:4200:4200"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    depends_on:
      zeiss-api:
        condition: service_started
    healthcheck:
      disable: true
